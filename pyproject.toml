[project]
name = "k8s-tests"
version = "0.1.0"
description = "Kubernetes-level tests and harnesses for the TrustyAI components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=43",
    "kubernetes>=31.0.0",
    "pyyaml>=6",
    "pytest>=8.0",
    # `k8s-tests test` writes the HTML report it documents, and the bundled pytest
    # configuration asks for one, so an installation cannot run the checks without it.
    "pytest-html>=4.1",
    "requests>=2.32",
]

[project.scripts]
k8s-tests = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "utilities"]

# The checks and their assets go into the wheel as `harness/data/`, under the names they
# have in the checkout: `k8s-tests` then runs the whole suite from anywhere, and
# `harness.resources` reads either layout.
[tool.hatch.build.targets.wheel.force-include]
"tests" = "harness/data/tests"
"conftest.py" = "harness/data/conftest.py"
"pyproject.toml" = "harness/data/pyproject.toml"
"hack" = "harness/data/hack"
# Only the report logo: the README's own logo has no business in the wheel.
"docs/trustyai.png" = "harness/data/docs/trustyai.png"

[project.optional-dependencies]
# What `lint` and `fmt` shell out to; only a checkout needs them.
tools = ["ruff>=0.6"]

[dependency-groups]
dev = [
    "pytest-html>=4.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "evalhub: checks for the EvalHub instance the workload operator deploys",
    "generation: checks for the collection generation API and the authorization the proxy applies to it",
    "emulator: checks for the LLM emulator and the token it requires",
    "benchmark: checks that submit an evaluation job and read its results",
    "image_pull_grace: the image-pull grace case, which waits out the operator's ten-minute grace before the failure is reported (own section: too slow for the default run)",
    "lmeval: checks for an LMEvalJob: its execution Pod and the NetworkPolicy that guards it",
    "adapters: EvalHub adapters: one real benchmark per job, run as a section of their own",
    "atif: the ATIF adapter section: MLflow, generated trajectories and the manifest, provenance, unscored and version-range behaviour",
    "module: checks for the TrustyAI module operator and the TrustyAI resource it reconciles",
    "isvc_free: checks that both operators work on a cluster with no KServe InferenceService API",
    "tas_payload: checks that the TrustyAIService operator writes payload capture into a KServe InferenceService, with the API installed",
    "workload: checks for the TrustyAI workload (service) operator",
    "service: checks for the TrustyAIService resource, its operand and the API behind it",
    "release: the operator releases a check applies to, from --release",
]
addopts = [
    "-ra",
    "-v",
    "--strict-config",
    "--strict-markers",
    "--durations=10",
    "--html=reports/report.html",
    "--self-contained-html",
]
# The API checks reach EvalHub through a port-forward, where the harness certificate
# cannot match 127.0.0.1; they are not TLS tests.
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
