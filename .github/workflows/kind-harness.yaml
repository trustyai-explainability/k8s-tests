name: Kind harness

# Builds the TrustyAI operators from a fresh checkout of
# trustyai-explainability/trustyai-service-operator, runs them on a Kind cluster, and
# runs the checks against that cluster.
#
# Manual only, and that is the permission gate: GitHub lets the repository's own writers
# dispatch a workflow and nobody else, so a fork's copy cannot be started by an outside
# account, and nothing here runs on a push, a pull request or a schedule. The job also
# refuses to start anywhere but this repository.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: trustyai-service-operator branch, tag or commit to test
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: kind-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Build the operators and run the checks
    # A fork that copies this file gets a no-op rather than a run of its own checkout.
    if: github.repository == 'trustyai-explainability/k8s-tests'
    runs-on: ubuntu-latest
    # The two operator images are Go builds, the cluster pulls a node image, and the
    # checks create and wait for a service operand; the default 6 hours is the ceiling
    # for a hang, not for the run.
    timeout-minutes: 120
    env:
      # Every knob is a setting and an environment variable of the same name, so this is
      # the same as `--operator-repo`, and `up`, `images` and `deploy` read it.
      OPERATOR_REPO: ${{ github.workspace }}/trustyai-service-operator
    steps:
      - name: Check out k8s-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: k8s-tests
          persist-credentials: false

      - name: Check out the operator
        # Cloned rather than checked out with actions/checkout: this token belongs to
        # this repository, and the operator clone needs no credential of its own.
        env:
          REF: ${{ inputs.ref }}
        run: |
          git clone --depth 1 https://github.com/trustyai-explainability/trustyai-service-operator.git "${OPERATOR_REPO}"
          if [ -n "${REF}" ]; then
            git -C "${OPERATOR_REPO}" fetch --depth 1 origin "${REF}"
            git -C "${OPERATOR_REPO}" checkout --detach FETCH_HEAD
          fi
          echo "testing ${OPERATOR_REPO} at $(git -C "${OPERATOR_REPO}" rev-parse HEAD)"

      - name: Free the disk the build does not need
        # The runner's preinstalled toolchains are several gigabytes, and what fills up
        # first is the disk the image builds and the Kind node share.
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          # The checks mint bearer tokens with `kubectl create token`, so 1.24 or newer.
          KUBECTL_VERSION: v1.37.2
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kind /tmp/kubectl
          sudo install -m 0755 /tmp/kind /tmp/kubectl /usr/local/bin/
          kind version
          kubectl version --client

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: k8s-tests/uv.lock

      - name: Install the Python environment
        working-directory: k8s-tests
        run: uv sync --frozen

      - name: Create the Kind cluster, build the images, deploy the operators
        working-directory: k8s-tests
        # `up` is the four steps in order: cluster, images, load, deploy. It also creates
        # the module resource and waits for both operators to run the images just built.
        run: uv run k8s-tests up

      - name: Run the checks
        working-directory: k8s-tests
        # The default section: every check except the adapters, whose benchmarks each
        # take minutes. It writes reports/report.html, which is self-contained.
        run: uv run k8s-tests test

      - name: Collect what the cluster looked like
        if: failure()
        working-directory: k8s-tests
        # The report says which check failed; this says what the cluster was doing.
        run: |
          set +e
          mkdir -p reports
          {
            echo "## pods"
            kubectl get pods --all-namespaces -o wide
            echo
            echo "## recent events"
            kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 100
            echo
            echo "## module resource"
            kubectl get trustyais.components.platform.opendatahub.io default-trustyai -o yaml
          } > reports/diagnostics.txt 2>&1 || true

      - name: Upload the report
        # Always, because a failing run is the one worth opening.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kind-harness-report
          path: k8s-tests/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Say what the run tested and where the report is
        if: always()
        run: |
          sha=$(git -C "${OPERATOR_REPO}" rev-parse HEAD 2>/dev/null || echo unknown)
          {
            echo "### Kind harness"
            echo
            echo "Tested [trustyai-service-operator at \`${sha}\`](https://github.com/trustyai-explainability/trustyai-service-operator/commit/${sha})."
            echo
            echo "The self-contained report is \`report.html\` in the \`kind-harness-report\` artifact;"
            echo "download it and open it in a browser. A failed run also carries \`diagnostics.txt\`."
          } >> "${GITHUB_STEP_SUMMARY}"
